name: Creation import visual review
on:
  pull_request:
    paths:
      - 'src/products/insights/creation/**'
      - 'scripts/review-creation-import.mjs'
      - 'tests/fixtures/swiftWorkbook.js'
      - '.github/workflows/creation-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creation-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect fixture UI without hosted writes
        run: node scripts/review-creation-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creation-import-screenshots
          path: docs/creation-import-review/
          if-no-files-found: warn
